<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <!-- img-src data: 必备（2026-11-05）：空态的品牌图是 data URI（同聊天页鸭子），
       少了这一项 CSP 直接拦掉，页面上就是个破图标框 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src data:;">
  {{headAssets}}
</head>
<body data-theme="{{theme}}">
  <div id="box">
    <div id="hdr">
      <input id="q" type="text" placeholder="{{t:svSearch}}" spellcheck="false">
      <span id="new" class="ico-btn" title="{{t:svNew}}"></span>
      <span id="refresh" class="ico-btn" title="{{t:svRefresh}}"></span>
      <!-- 2026-10-20 图2 拍板：中间区 ✳ 菜单移列到左列表——⚡ 命令菜单（会话操作/配置） -->
      <span id="gear" class="ico-btn" title="{{t:svMore}}"></span>
    </div>
    <div id="list"></div>
    <!-- 空态（2026-11-05 用户要求「加个很强的符号/按钮提醒新建会话」）：
         真有会话但搜索没命中时只显示一行文字；一条会话都没有时才出大 + 和按钮 -->
    <div id="empty" style="display:none">
      <div class="e-new" id="empty-new" title="{{t:svEmptyNew}}">
        <img class="e-logo" src="{{emptyLogo}}" alt="">
        <div class="e-title">{{t:svEmptyNew}}</div>
        <div class="e-sub">{{t:svEmptyNewHint}}</div>
        <button class="e-btn">{{t:svNew}}</button>
      </div>
      <div class="e-plain" id="empty-plain">{{t:svEmpty}}</div>
    </div>
  </div>
  <script nonce="{{nonce}}">{{js}}</script>
</body>
</html>
