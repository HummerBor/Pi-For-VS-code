<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  {{headAssets}}
</head>
<body data-theme="{{theme}}">
  <div id="box">
    <div id="hdr">
      <input id="q" type="text" placeholder="{{t:svSearch}}" spellcheck="false">
      <span id="new" class="ico-btn" title="{{t:svNew}}"></span>
      <span id="refresh" class="ico-btn" title="{{t:svRefresh}}"></span>
    </div>
    <div id="list"></div>
    <div id="empty" style="display:none">{{t:svEmpty}}</div>
  </div>
  <script nonce="{{nonce}}">{{js}}</script>
</body>
</html>
