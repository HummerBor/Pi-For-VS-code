<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src data:;">
  {{headAssets}}
</head>
<body data-theme="{{theme}}">
  {{bgLayer}}
  <div id="header">
    <div id="hdr-row1">
      <img id="logo" src="{{duckUri}}" title="Pi For VSC">
      <span id="session" class="hdr-btn" title="{{t:sessionBtnTitle}}">{{t:sessionLabel}}—</span>
      <span class="spacer"></span>
      <span id="subind" class="ico-btn" style="display:none" title="{{t:smReopen}}"></span>
      <span id="history" class="ico-btn" title="{{t:historyTitle}}"></span>
      <span id="newchat" class="ico-btn" title="{{t:newChatTitle}}"></span>
      <span id="more" class="ico-btn" title="{{t:moreTitle}}"></span>
    </div>
  </div>
  <div id="tabbar"></div>
  <!-- 工单24 架构归位二期（用户定调「下面整个一坨是一个 DOM」）：下区整体是会话域——
       横幅/变更条/消息流/排队条/状态行/输入区/页脚全部随页签走。此处的 .session-view
       是原型，JS 启动时按页签克隆整棵，后台页签的每个控件都在自己的隐藏视图里活渲染，
       切页签=换可见性，零重渲零重拉 -->
  <div id="session-area">
    <div class="session-view" data-tab="t1">
      <div id="banner" style="display:none"></div>
      <div id="changesbar" style="display:none"></div>
      <div id="compactbar" style="display:none"></div>
      <div class="msg-root">
        <div id="welcome">
          <img class="w-duck" src="{{duckUri}}" width="96" height="96">
          <div class="w-title">{{t:welcomeTitle}}</div>
          <div class="w-tip"></div>
          <div class="w-sub">{{t:welcomeSub}}</div>
        </div>
      </div>
      <!-- 消息大纲轨道（对齐 DeepSeek/Codex web）：随页签克隆，main.ts 建视图时按 root 可视区重摆 -->
      <div id="outline" class="outline"></div>
      <!-- 自绘滚动进度 thumb（方案B）：随页签克隆，olSpy 滚动帧同步位置；老内核不显示（原生条兑底） -->
      <div id="queuebar"></div>
      <div id="statusline"><span id="status"></span></div>
      <div id="composer">
        <div id="suggest"></div>
        <div id="plusmenu">
          <div class="pm-item" id="pm-upload"></div>
          <div class="pm-item" id="pm-at"></div>
        </div>
        <input type="file" id="file" multiple style="display:none">
        <div id="attachbar"></div>
        <textarea id="input" placeholder="{{t:inputPlaceholder}}"></textarea>
        <div id="ctoolbar">
          <span id="attach" class="tb-btn" title="{{t:attachTitle}}"></span>
          <span id="codechip" style="display:none"></span>
          <span class="tb-spacer"></span>
          <button id="stop" title="{{t:stopTitle}}"></button>
          <button id="send" title="{{t:sendTitle}}"></button>
        </div>
      </div>
      <div id="bottombar">
        <span id="model" class="tb-btn" title="{{t:modelTitle}}">—</span>
        <span id="think" class="tb-btn" title="{{t:thinkTitle}}">{{t:thinkLabel}}—</span>
        <span id="modebadge" class="tb-btn" title="{{t:modeBadgeTitle}}"></span>
        <span id="usage"></span>
        <span id="ver">v{{version}}</span>
      </div>
    </div>
  </div>
  <script nonce="{{nonce}}">{{js}}</script>
</body>
</html>
